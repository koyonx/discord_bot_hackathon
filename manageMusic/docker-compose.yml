services:
  bot:
    build: ./bot
    env_file: .env
    environment:
      - DB_PATH=/data/manage_music.db
    volumes:
      - ./data:/data
    restart: unless-stopped

  web:
    build: ./web
    environment:
      - DB_PATH=/data/manage_music.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped
