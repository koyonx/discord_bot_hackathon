services:
  bot:
    build: .
    image: prereview-bot:local
    container_name: prereviewBot
    env_file:
      - .env
    restart: unless-stopped
    init: true
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
